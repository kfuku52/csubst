[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "numpy",
    "Cython>=3",
]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-exclude = [
    "csubst/_vendor",
    "tests/cython_test.py",
    "tests/equation_parser.ipynb",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
