# Installed from kfrepo-update's trusted Dependabot observer template.
name: Dependabot CI notification

on:
  workflow_run:
    workflows: ['*']
    types: [completed]
    branches: ['dependabot/**']
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing CI run ID for a notification transport check
        type: string
        required: true

permissions: {}

concurrency:
  group: dependabot-ci-notify-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      vars.DEPENDABOT_NOTIFY_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_commit.message, 'chore: prepare Dependabot update')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create token for the central notification endpoint
        id: notification-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_NOTIFY_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_NOTIFY_PRIVATE_KEY }}
          owner: kfuku52
          repositories: kfdependabot-maintenance
          permission-actions: write
      - name: Notify the trusted default-branch controller
        env:
          NOTIFICATION_TOKEN: ${{ steps.notification-token.outputs.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.request

          run_id = os.environ["CI_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]{0,19}", run_id):
              raise ValueError("Invalid CI run ID")
          payload = {
              "ref": "main",
              "inputs": {"repository": os.environ["TARGET_REPOSITORY"], "run_id": run_id},
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/kfuku52/kfdependabot-maintenance/actions/workflows/"
              "dependabot-after-ci.yml/dispatches",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["NOTIFICATION_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError("CI notification was not accepted")
          print("CI notification accepted by the controller")
          PYTHON
