[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-config --strict-markers
markers =
    cli: exercises the command-line parser or executable entry point
    integration: exercises coordination across modules or filesystem/process boundaries
    slow: takes materially longer than the ordinary unit-test feedback loop
    process: starts nested worker processes and should run outside pytest-xdist
    parity: compares independent implementations or execution backends
    requires_cython: requires the compiled Cython extensions
    native: validates a real accelerator path; run with CSUBST_STRICT_EXTENSIONS=1
